services:
  ai-audit-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-audit-operating-system:latest
    container_name: ai-audit-operating-system
    restart: unless-stopped
    ports:
      - "${PORT:-3003}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      # LLM Provider Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-gemini-3.6-flash}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Engine & OCR
      - OCR_ENGINE=${OCR_ENGINE:-tesseract}
      - FUZZY_MATCH_THRESHOLD=${FUZZY_MATCH_THRESHOLD:-0.70}
      - EXTRACTION_MAX_WORDS=${EXTRACTION_MAX_WORDS:-200000}
      # Database
      - DATABASE_URL=${DATABASE_URL:-sqlite:./audit_os.db}
      # Reviewer Signatory Defaults
      - VITE_LEAD_AUDIT_REVIEWER_NAME=${VITE_LEAD_AUDIT_REVIEWER_NAME:-David Vance, CPA, CIA}
      - VITE_LEAD_AUDIT_REVIEWER_TITLE=${VITE_LEAD_AUDIT_REVIEWER_TITLE:-Authorized Audit Partner}
    volumes:
      # Persist SQLite audit database across container recreations
      - audit_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  audit_data:
    driver: local
